<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crank Tracker</title>
    <style>
      body {
        margin: 0;
        padding: 1rem;
        font-family: sans-serif;
        min-height: 100vh;
        box-sizing: border-box;
      }

      #timerButton {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 50vh;
        font-size: 2rem;
      }

      .controls {
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Crank Tracker</h1>
    <audio id="clarityAudio" autoplay loop>
      <source src="./clarity.mp3" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>
    <label for="pauseDelaySeconds">Pause delay (0-30 seconds): </label>
    <input
      id="pauseDelaySeconds"
      type="number"
      min="0"
      max="30"
      value="5"
      step="1"
    />
    <button type="button" id="timerButton">PRESS FOR CLARITY</button>
    <script>
      const clarityAudio = document.getElementById("clarityAudio");
      const pauseDelaySecondsInput = document.getElementById("pauseDelaySeconds");
      const timerButton = document.getElementById("timerButton");
      let pauseTimerId = null;

      const getPauseDelayMs = () => {
        const parsedValue = Number.parseInt(pauseDelaySecondsInput.value, 10);

        if (Number.isNaN(parsedValue)) {
          return 0;
        }

        const clampedValue = Math.min(30, Math.max(0, parsedValue));
        pauseDelaySecondsInput.value = clampedValue;
        return clampedValue * 1000;
      };

      timerButton.addEventListener("click", () => {
        clarityAudio.play();
        if (pauseTimerId !== null) {
          window.clearTimeout(pauseTimerId);
        }

        pauseTimerId = window.setTimeout(() => {
          clarityAudio.pause();
          pauseTimerId = null;
        }, getPauseDelayMs());
      });

      window.addEventListener("load", () => {
        clarityAudio.play().catch(() => {});
      });
    </script>
  </body>
</html>
