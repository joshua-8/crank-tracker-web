<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crank Tracker</title>
  </head>
  <body>
    <h1>Crank Tracker</h1>
    <p>This site is hosted with GitHub Pages.</p>
    <audio id="clarityAudio" autoplay loop>
      <source src="./clarity.mp3" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>
    <div>
      <button type="button" id="playButton">Play</button>
      <button type="button" id="pauseButton">Pause</button>
    </div>
    <script>
      const clarityAudio = document.getElementById("clarityAudio");
      const playButton = document.getElementById("playButton");
      const pauseButton = document.getElementById("pauseButton");

      playButton.addEventListener("click", () => {
        clarityAudio.play();
      });

      pauseButton.addEventListener("click", () => {
        clarityAudio.pause();
      });

      window.addEventListener("load", () => {
        clarityAudio.play().catch(() => {});
      });
    </script>
  </body>
</html>
