<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        padding: 1rem;
        font-family: sans-serif;
        min-height: 100vh;
        box-sizing: border-box;
      }

      #timerButton {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 30vh;
        font-size: 2rem;
        background-image: url("./Zedd.jpg");
        background-size: cover;
        background-position: center;
        color: white;
      }

      .controls {
        margin-bottom: 1rem;
      }

      #countdownDisplay {
        margin: 1rem 0;
        font-size: 10rem;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>G gym playlist</h1>
    <audio id="clarityAudio" autoplay loop>
      <source src="./clarity.mp3" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>
    <label for="pauseDelaySeconds">Pause delay (seconds): </label>
    <input
      id="pauseDelaySeconds"
      type="number"
      min="0"
      value="5"
      step="1"
    />
    <div id="countdownDisplay">00:00</div>
    <button type="button" id="timerButton">PRESS FOR CLARITY</button>
    <script>
      const clarityAudio = document.getElementById("clarityAudio");
      const pauseDelaySecondsInput = document.getElementById("pauseDelaySeconds");
      const countdownDisplay = document.getElementById("countdownDisplay");
      const timerButton = document.getElementById("timerButton");
      let pauseTimerId = null;
      let countdownIntervalId = null;

      const formatDuration = (durationMs) => {
        const totalSeconds = Math.max(0, Math.ceil(durationMs / 1000));
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      };

      const updateCountdownDisplay = (durationMs) => {
        countdownDisplay.textContent = formatDuration(durationMs);
      };

      const clearCountdownInterval = () => {
        if (countdownIntervalId !== null) {
          window.clearInterval(countdownIntervalId);
          countdownIntervalId = null;
        }
      };

      const startCountdown = (durationMs) => {
        clearCountdownInterval();
        updateCountdownDisplay(durationMs);

        if (durationMs <= 0) {
          return;
        }

        const countdownEndTime = Date.now() + durationMs;

        countdownIntervalId = window.setInterval(() => {
          const remainingMs = countdownEndTime - Date.now();
          if (remainingMs <= 0) {
            updateCountdownDisplay(0);
            clearCountdownInterval();
            return;
          }

          updateCountdownDisplay(remainingMs);
        }, 200);
      };

      const getPauseDelayMs = () => {
        const parsedValue = Number.parseInt(pauseDelaySecondsInput.value, 10);

        if (Number.isNaN(parsedValue)) {
          return 0;
        }

        const clampedValue = Math.max(0, parsedValue);
        pauseDelaySecondsInput.value = clampedValue;
        return clampedValue * 1000;
      };

      timerButton.addEventListener("click", () => {
        clarityAudio.play();
        if (pauseTimerId !== null) {
          window.clearTimeout(pauseTimerId);
        }

        const pauseDelayMs = getPauseDelayMs();
        startCountdown(pauseDelayMs);

        pauseTimerId = window.setTimeout(() => {
          clarityAudio.pause();
          updateCountdownDisplay(0);
          clearCountdownInterval();
          pauseTimerId = null;
        }, pauseDelayMs);
      });

      window.addEventListener("load", () => {
        clarityAudio.play().catch(() => {});
      });
    </script>
  </body>
</html>
